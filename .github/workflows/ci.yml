name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      # Typecheck, run the smoke test against the mocked Minecraft API, build.
      - name: Check
        run: npm run check

      - name: Package the addon
        run: npm run package

      - name: Confirm the docs are in sync with the source
        run: |
          npm run docs
          git diff --exit-code docs/ \
            || (echo "::error::docs/ is stale - run 'npm run docs' and commit the result" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: mcaddon
          path: dist/*.mcaddon
